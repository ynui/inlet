name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  VERSION: ${{ github.ref_name }}
  COMMIT: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build all release targets
        run: |
          targets=(
            "darwin-arm64 darwin arm64"
            "darwin-amd64 darwin amd64"
            "linux-amd64 linux amd64"
            "linux-arm64 linux arm64"
            "windows-amd64 windows amd64"
          )

          for target in "${targets[@]}"; do
            read -r name goos goarch <<< "$target"
            out="dist/bin-$name"
            mkdir -p "$out"
            ext=""
            if [[ "$goos" == windows ]]; then ext=".exe"; fi

            common="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT:0:7}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="$common -X main.defaultServerURL=wss://inletd.onrender.com" \
              -o "$out/inlet$ext" ./cmd/client
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="$common" -o "$out/inletd$ext" ./cmd/server
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-binaries
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-binaries
          path: dist

      - name: Package
        run: |
          for dir in dist/bin-*/; do
            arch=${dir#dist/bin-}; arch=${arch%/}
            if compgen -G "$dir/*.exe" >/dev/null; then
              zip -q "inlet-$VERSION-$arch.zip" -j "$dir/inlet.exe"
              zip -q "inletd-$VERSION-$arch.zip" -j "$dir/inletd.exe"
            else
              tar -czf "inlet-$VERSION-$arch.tar.gz" -C "$dir" inlet
              tar -czf "inletd-$VERSION-$arch.tar.gz" -C "$dir" inletd
            fi
          done
          sha256sum inlet-"$VERSION"-* inletd-"$VERSION"-* > "inlet-$VERSION-checksums.txt"
          cat "inlet-$VERSION-checksums.txt"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: inlet*-${{ env.VERSION }}-*

      - name: Bump Homebrew tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN not set; skipping tap bump"; exit 0; fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/ynui/homebrew-tap.git" tap
          cd tap
          python3 - "$VERSION" <<'PY'
          import hashlib, pathlib, re, sys
          ver = sys.argv[1].removeprefix("v")
          base = "https://github.com/ynui/inlet/releases/download"
          shas = {}
          for f in pathlib.Path("..").glob("inlet-*.tar.gz"):
              m = re.fullmatch(r"inlet-v[\d.]+-(darwin|linux)-(arm64|amd64)\.tar\.gz", f.name)
              if not m:
                  continue
              shas[f"{m.group(1)}-{m.group(2)}"] = hashlib.sha256(f.read_bytes()).hexdigest()
          path = pathlib.Path("Formula/inlet.rb")
          if not path.exists():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text('''class Inlet < Formula
            desc "Expose local HTTP apps through stable public URLs"
            homepage "https://github.com/ynui/inlet"
            version "0.0.1"

            on_macos do
              on_arm do
                url "https://github.com/ynui/inlet/releases/download/v0.0.1/inlet-v0.0.1-darwin-arm64.tar.gz"
                sha256 "0"
              end
              on_intel do
                url "https://github.com/ynui/inlet/releases/download/v0.0.1/inlet-v0.0.1-darwin-amd64.tar.gz"
                sha256 "0"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/ynui/inlet/releases/download/v0.0.1/inlet-v0.0.1-linux-arm64.tar.gz"
                sha256 "0"
              end
              on_intel do
                url "https://github.com/ynui/inlet/releases/download/v0.0.1/inlet-v0.0.1-linux-amd64.tar.gz"
                sha256 "0"
              end
            end

            def install
              bin.install "inlet"
            end

            test do
              assert_match "inlet", shell_output("#{bin}/inlet version")
            end
          end
          ''')
              print("Created Formula/inlet.rb")
          arch, out = None, []
          for line in path.read_text().splitlines():
              if ".tar.gz" in line:
                  arch = re.search(r"(darwin|linux)-(arm64|amd64)\.tar\.gz", line).group(0)[:-7]
                  pad = line[: len(line) - len(line.lstrip())]
                  line = f'{pad}url "{base}/v{ver}/inlet-v{ver}-{arch}.tar.gz"'
              elif line.strip().startswith("sha256"):
                  pad = line[: len(line) - len(line.lstrip())]
                  line = f'{pad}sha256 "{shas[arch]}"'
              elif line.startswith("  version"):
                  line = f'  version "{ver}"'
              elif line.strip().startswith("bin.install"):
                  pad = line[: len(line) - len(line.lstrip())]
                  line = f'{pad}bin.install "inlet"'
              out.append(line)
          path.write_text("\n".join(out) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/inlet.rb
          if ! git diff --cached --quiet; then
            git commit -m "inlet $VERSION"
            git push
          else
            echo "Tap formula already up to date"
          fi
