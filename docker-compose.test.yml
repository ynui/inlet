services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inlet
      POSTGRES_PASSWORD: inlet
      POSTGRES_DB: inlet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inlet"]
      interval: 2s
      timeout: 5s
      retries: 10
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: inlet
      MYSQL_DATABASE: inlet
      MYSQL_USER: inlet
      MYSQL_PASSWORD: inlet
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pinlet"]
      interval: 2s
      timeout: 5s
      retries: 15
