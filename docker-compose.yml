services:
  inletd:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: inletd
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./data/inlet:/data
    environment:
      - INLET_DB=/data/inlet.db
      - TZ=UTC
