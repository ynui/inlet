services:
  inletd:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${INLET_HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      - INLET_DB=/data/inlet.db
      - TZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/_inlet/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
